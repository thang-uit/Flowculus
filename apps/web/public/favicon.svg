<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="fav-title">
  <title id="fav-title">Flowculus</title>
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#D09A14"/>
    </linearGradient>
  </defs>

  <!-- Background square -->
  <rect width="64" height="64" rx="18" fill="url(#fav-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="#A87300" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- "F" vertical stem -->
  <rect x="16" y="14" width="6" height="30" rx="2.5" fill="#3D2800"/>
  <!-- "F" top bar -->
  <rect x="16" y="14" width="22" height="6" rx="2.5" fill="#3D2800"/>
  <!-- "F" middle bar -->
  <rect x="16" y="27" width="16" height="5.5" rx="2.5" fill="#3D2800"/>

  <!-- Flow arrow shaft -->
  <line x1="34" y1="33.5" x2="48" y2="33.5" stroke="#3D2800" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Arrow head -->
  <path d="M44 27.5 L51 33.5 L44 39.5" fill="none" stroke="#3D2800" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Top-right accent dot -->
  <circle cx="49" cy="18" r="4" fill="#3D2800" opacity="0.5"/>
</svg>
